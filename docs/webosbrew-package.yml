# The webosbrew Homebrew Channel listing for JellyRust.
#
# THIS FILE DOES NOT BELONG TO THIS REPOSITORY AT RUNTIME. It is kept here so the listing is
# version-controlled next to the thing it describes; the submitted copy is
# `packages/com.macluckylab.jellyrust.yml` in the mac-lucky fork of
# https://github.com/webosbrew/apps-repo. Change both together.
#
# Schema: content/schemas/packages/PackageInfo.json in that repo.
# Required: title, iconUri, manifestUrl, category, pool, description.
#
# Every claim in `description` must be one the current release note makes
# (docs/release-notes/), and no stronger.

title: JellyRust

# Raw links to this repository's default branch; `repogen.lintpkg` rejects a submission whose
# iconUri does not return 200. 160 for the listing card, 320 for the detail page.
iconUri: https://raw.githubusercontent.com/mac-lucky/jellyrust/main/pkg/icon160.png
detailIconUri: https://raw.githubusercontent.com/mac-lucky/jellyrust/main/pkg/icon320.png

# `releases/latest/download/...` always resolves to the newest release, which is how the channel
# picks up an update without this file changing; a draft or prerelease would break it.
manifestUrl: https://github.com/mac-lucky/jellyrust/releases/latest/download/com.macluckylab.jellyrust.manifest.json

category: multimedia
pool: main

# Max 80 characters (schema-enforced).
shortDescription: A native Jellyfin client for LG webOS TVs with the look of Litefin

# Rendered by tools/litefin-shot.sh from the openly licensed demo library, credited in
# docs/screenshots/CREDITS.md. Pinned to the release tag, so the listing shows the release it
# describes; move the tag with each release.
screenshots:
  - url: https://raw.githubusercontent.com/mac-lucky/jellyrust/v0.12.0/docs/screenshots/jellyrust/home.jpg
    caption: Home
  - url: https://raw.githubusercontent.com/mac-lucky/jellyrust/v0.12.0/docs/screenshots/jellyrust/detail.jpg
    caption: A film's page
  - url: https://raw.githubusercontent.com/mac-lucky/jellyrust/v0.12.0/docs/screenshots/jellyrust/player.jpg
    caption: Playback

requirements:
  # A STARTUP bound, passed to `webosbrew-ipk-verify --fw-releases` by the release workflow, the
  # same as Native Jelly's. Playback is a narrower claim and lives in the description.
  webosRelease: '>=4.0'

description: |
  An unofficial, native Jellyfin client for LG webOS televisions with the look of [Litefin](https://github.com/MoazSalem/litefin).

  JellyRust is a fork of [Native Jelly](https://github.com/sostk/native-jelly). It draws its interface directly on the GPU and hands video to the television's own hardware decoder, and it looks like Litefin: a pure black theme, the left rail, Litefin's home rows, detail pages and player controls. It installs as its own app, beside Native Jelly or Litefin.

  **What it does**

  * Sign in to your Jellyfin server with a Quick Connect code approved from another device
  * Several Jellyfin users on one television, with **Who's watching?** at start
  * Home, your libraries, Favorites, Random, Search and Continue Watching
  * Plays a file directly when the television can decode it; anything else is converted by your server, which also records where you stopped and what you finished
  * Audio and subtitle tracks follow what your server remembers for you, with a preference for dubbed or voice-over audio
  * English, Polish, Spanish, Russian and Belarusian

  **Scope - please read before installing**

  * **Video playback is verified on two televisions:** an LG C1 (2021) on webOS 6.5.3 and an LG C5 (2025) on webOS 10.3.1. On every other firmware from webOS 4.0 up the app is only known to pass a static compatibility check. If you try it on another set, please [report what happened](https://github.com/mac-lucky/jellyrust/issues), whether it worked or not.
  * **Movies and TV shows only.** No music, photos or live TV.
  * **Never type a password into the app:** it logs typed text on the TV. Sign in with Quick Connect.

  No telemetry: the app contains no crash-reporting or analytics code, and the only server it talks to is yours.

  Screenshots show openly licensed films from the Blender Foundation and others, credited in [CREDITS.md](https://github.com/mac-lucky/jellyrust/blob/main/docs/screenshots/CREDITS.md).

  Not affiliated with, endorsed by, or sponsored by the Jellyfin project, LG Electronics, Native Jelly or Litefin.

  Source, release notes and issues: https://github.com/mac-lucky/jellyrust
